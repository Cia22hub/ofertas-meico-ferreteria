<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEICO Occidente | Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header Fijo y Moderno -->
    <header class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-orange-600 p-2 rounded-lg text-white font-bold text-xl italic">M</div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">MEICO <span class="text-orange-600 text-sm block leading-3">Occidente</span></h1>
            </div>
            <input type="text" id="search" placeholder="Buscar producto o marca..." 
                   class="w-full md:w-64 px-4 py-2 rounded-full border border-slate-300 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <!-- Indicador de Carga -->
        <div id="loader" class="flex flex-col items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600"></div>
            <p class="mt-4 text-slate-500 animate-pulse">Sincronizando con Drive...</p>
        </div>

        <!-- Grid de Ofertas -->
        <div id="grid-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0 transition-opacity duration-500">
            <!-- Las tarjetas se inyectan aquí -->
        </div>
    </main>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXbWQ6byGnF7ONqDe-0uTbNq9Qfwd5oI5Q1mFo3SLsw8tr_-oiRtb-CIFP0ANCWUELMw/exe"; // Pega aquí la URL de implementación

        async function fetchOfertas() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                renderOfertas(data);
            } catch (error) {
                console.error("Error cargando datos:", error);
                document.getElementById('loader').innerHTML = "❌ Error al cargar ofertas";
            }
        }

        function renderOfertas(ofertas) {
            const grid = document.getElementById('grid-ofertas');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = ofertas.map(oferta => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 group">
                    <div class="relative h-48 overflow-hidden bg-slate-200">
                        <img src="${oferta.imgUrl || 'https://via.placeholder.com/400x300?text=MEICO'}" 
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                             alt="${oferta.titulo}">
                        <div class="absolute top-3 right-3 bg-orange-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">
                            OFERTA MES
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-slate-800 mb-2 leading-tight">${oferta.titulo}</h3>
                        <div class="text-sm text-slate-600 space-y-1 mb-4 whitespace-pre-line">
                            ${oferta.descripcion}
                        </div>
                        <button onclick="window.open('https://wa.me/?text=Hola, me interesa la oferta de: ${oferta.titulo}')"
                                class="w-full bg-slate-900 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
                            <span>Consultar Asesor</span>
                        </button>
                    </div>
                </div>
            `).join('');

            loader.classList.add('hidden');
            grid.classList.remove('opacity-0');
        }

        // Buscador simple
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#grid-ofertas > div');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        });

        window.onload = fetchOfertas;
    </script>
</body>
</html>
