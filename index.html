<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEICO Occidente | Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-orange-600 text-white p-2 rounded-lg font-bold text-xl">M</div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 leading-tight">MEICO</h1>
                    <p class="text-orange-600 text-xs font-bold tracking-widest uppercase">Occidente</p>
                </div>
            </div>
            <input type="text" id="search" placeholder="Buscar producto..." 
                   class="w-full md:w-80 px-4 py-2 rounded-full border border-slate-300 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <!-- Cargando -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600"></div>
            <p class="mt-4 text-slate-500 font-medium">Cargando ofertas de hoy...</p>
        </div>

        <!-- Grid de Productos -->
        <div id="grid-ofertas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE (La que termina en /exec)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWQpWZYqxgYAWQ6vTbOqW0-ewZ6VGkXq63sRgh2nmXe3MTyqMFZFOGPduRIdzQcXt6jQ/exec";

        async function fetchOfertas() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                renderOfertas(data);
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `
                    <div class="text-center bg-red-50 p-6 rounded-2xl border border-red-100">
                        <p class="text-red-600 font-bold text-lg">❌ Error de conexión</p>
                        <p class="text-red-400 text-sm mt-1">No se pudo cargar el catálogo.</p>
                        <button onclick="location.reload()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-lg text-sm font-bold">Reintentar</button>
                    </div>
                `;
            }
        }

        function renderOfertas(ofertas) {
            const grid = document.getElementById('grid-ofertas');
            const loader = document.getElementById('loader');
            
            if (ofertas.length === 0) {
                loader.innerHTML = "<p class='text-slate-500'>No hay ofertas disponibles en este momento.</p>";
                return;
            }

            grid.innerHTML = ofertas.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col">
                    <div class="h-48 bg-slate-100 overflow-hidden relative">
                        <img src="${item.imagen_id ? 'https://lh3.googleusercontent.com/d/' + item.imagen_id : 'https://via.placeholder.com/400x300?text=MEICO+OFERTA'}" 
                             class="w-full h-full object-cover" 
                             alt="${item.titulo}">
                        <div class="absolute top-2 left-2 bg-orange-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-md uppercase">Vigente</div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-bold text-slate-800 text-lg leading-snug mb-3">${item.titulo || 'Sin Título'}</h3>
                        <div class="text-slate-600 text-sm whitespace-pre-line flex-grow mb-4 italic">
                            ${item.descripcion || 'Sin descripción'}
                        </div>
                        <button onclick="window.open('https://wa.me/573000000000?text=Hola, me interesa la oferta de: ${encodeURIComponent(item.titulo)}')" 
                                class="w-full bg-slate-900 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.888 11.888-11.888 3.176 0 6.161 1.237 8.404 3.48s3.481 5.229 3.481 8.406c0 6.555-5.332 11.89-11.888 11.89-1.996 0-3.951-.502-5.692-1.455l-6.292 1.656zm6.136-4.275l.441.262c1.343.801 2.89 1.224 4.47 1.224 4.899 0 8.887-3.988 8.887-8.888 0-2.37-1.03-4.6-2.614-6.185a8.813 8.813 0 00-6.273-2.58c-4.899 0-8.887 3.988-8.887 8.888 0 1.741.503 3.441 1.457 4.912l.288.445-1.104 4.032 4.129-1.087z"/></svg>
                            Consultar Oferta
                        </button>
                    </div>
                </div>
            `).join('');

            loader.style.display = 'none';
        }

        // Buscador
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#grid-ofertas > div');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        });

        window.onload = fetchOfertas;
    </script>
</body>
</html>
