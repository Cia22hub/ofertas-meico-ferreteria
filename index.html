<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEICO Occidente | Catálogo de Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .bg-meico { background-color: #063b83; }
        .text-meico { color: #063b83; }
        .border-meico { border-color: #063b83; }
    </style>
</head>
<body>

    <!-- Header con el Azul de MEICO -->
    <header class="bg-meico shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white text-meico p-2 rounded-lg font-bold text-xl shadow-inner">M</div>
                <div>
                    <h1 class="text-xl font-bold text-white leading-tight">MEICO</h1>
                    <p class="text-blue-200 text-xs font-bold tracking-widest uppercase italic">Occidente</p>
                </div>
            </div>
            <!-- Buscador para agilidad del asesor -->
            <div class="relative w-full md:w-96">
                <input type="text" id="search" placeholder="Buscar producto o escala..." 
                       class="w-full pl-10 pr-4 py-2 rounded-xl border-none focus:ring-4 focus:ring-blue-400 outline-none transition-all shadow-lg text-slate-700">
                <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Indicador de Carga -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white border-t-meico"></div>
            <p class="mt-4 text-slate-600 font-medium italic">Sincronizando ofertas con Drive...</p>
        </div>

        <!-- Grid de Ofertas -->
        <div id="grid-ofertas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWQpWZYqxgYAWQ6vTbOqW0-ewZ6VGkXq63sRgh2nmXe3MTyqMFZFOGPduRIdzQcXt6jQ/exec";

        async function fetchOfertas() {
            try {
                const response = await fetch(WEB_APP_URL);
                const rawData = await response.json();
                
                // Limpiar nombres de columnas (quitar espacios y tildes)
                const data = rawData.map(item => {
                    const newItem = {};
                    for (let key in item) {
                        const cleanKey = key.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                        newItem[cleanKey] = item[key];
                    }
                    return newItem;
                });

                renderOfertas(data);
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `<p class="text-red-500">Error al conectar con los datos.</p>`;
            }
        }

        function renderOfertas(ofertas) {
            const grid = document.getElementById('grid-ofertas');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = ofertas.map(item => `
                <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden hover:border-blue-400 transition-all duration-300 flex flex-col">
                    <!-- Imagen del Producto -->
                    <div class="h-52 bg-slate-100 overflow-hidden relative">
                        <img src="${item.imagen_id ? 'https://lh3.googleusercontent.com/d/' + item.imagen_id : 'https://via.placeholder.com/400x300?text=SIN+IMAGEN'}" 
                             class="w-full h-full object-contain p-2" 
                             alt="${item.t
