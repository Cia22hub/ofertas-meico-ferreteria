<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEICO | Escalas Vigentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .bg-meico { background-color: #063b83; }
        .text-meico { color: #063b83; }
    </style>
</head>
<body>

    <header class="bg-meico shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white text-meico p-2 rounded-lg font-bold text-xl shadow-md">M</div>
                <div>
                    <h1 class="text-xl font-extrabold text-white leading-tight tracking-tighter">MEICO OCCIDENTE</h1>
                    <p class="text-blue-300 text-[10px] font-bold tracking-[0.2em] uppercase">Escalas de Aliados</p>
                </div>
            </div>
            <div class="relative w-full md:w-96">
                <input type="text" id="search" placeholder="Buscar proveedor (ej: 3M, Yale...)" 
                       class="w-full pl-10 pr-4 py-3 rounded-2xl border-none focus:ring-4 focus:ring-blue-500 outline-none shadow-lg text-slate-700 font-medium">
                <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-meico"></div>
            <p class="mt-4 text-slate-500 font-bold animate-pulse">Sincronizando con Excel...</p>
        </div>

        <div id="grid-ofertas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7aaRlTw3oUHhBUEZ82TnsGxa3THg63nrK5kQPs_Fu0XdxBmuEit8WCz4Q1Pchz4TfuA/exec"; // REEMPLAZA ESTO

        async function fetchOfertas() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                renderOfertas(data);
                document.getElementById('loader').style.display = 'none';
            } catch (error) {
                document.getElementById('loader').innerHTML = `<p class="text-red-500 font-bold">⚠️ Error de conexión: Verifica el nombre de la pestaña "Septiembre"</p>`;
            }
        }

        function renderOfertas(ofertas) {
            const grid = document.getElementById('grid-ofertas');
            grid.innerHTML = ofertas.map(item => `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-2xl transition-all duration-300 flex flex-col">
                    <div class="p-6 bg-slate-50 border-b border-slate-100">
                        <h3 class="font-black text-meico text-xl uppercase tracking-tighter">${item.proveedor}</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1 italic">${item.vigencia || 'Vigencia Octubre'}</p>
                    </div>

                    <div class="p-6 space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-yellow-50 p-3 rounded-2xl border border-yellow-100">
                                <p class="text-[9px] font-black text-yellow-600 uppercase mb-1 text-center italic">Escala 1</p>
                                <p class="text-xs font-bold text-slate-700 text-center">${item.colo1 || 'N/A'}</p>
                            </div>
                            <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100">
                                <p class="text-[9px] font-black text-blue-600 uppercase mb-1 text-center italic">Escala 2</p>
                                <p class="text-xs font-bold text-slate-700 text-center">${item.colo2 || 'N/A'}</p>
                            </div>
                        </div>

                        <div class="bg-slate-800 p-4 rounded-2xl">
                            <p class="text-[9px] font-black text-blue-300 uppercase mb-2 tracking-widest">Condiciones Adicionales:</p>
                            <p class="text-white text-xs leading-relaxed font-medium italic">${item.descuentos || 'Sin descuentos adicionales.'}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('#grid-ofertas > div').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        });

        window.onload = fetchOfertas;
    </script>
</body>
</html>
